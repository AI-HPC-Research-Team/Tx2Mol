<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="252" viewBox="0 0 1000 252" role="img" aria-labelledby="title desc">
  <title id="title">Tx2Mol — from gene expression to molecular design</title>
  <desc id="desc">Three stages: GeneVAE pretraining, Tx2Mol post-training, and phenotype-guided SMILES generation. Decorative particles move gently along the connections.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#078e8a"/><stop offset="1" stop-color="#db735f"/></linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#bfdedc" opacity=".48"/></pattern>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
    .cell { animation: breathe 5s ease-in-out infinite; }
    .packet { animation: travel 4.8s ease-in-out infinite; }
    .packet.second { animation-delay: -2.4s; }
    .halo { transform-box: fill-box; transform-origin: center; animation: halo 5s ease-in-out infinite; }
    .float { animation: float 6s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { opacity: .4; } 50% { opacity: .95; } }
    @keyframes travel { 0%, 12% { transform: translateX(0); opacity: 0; } 25% { opacity: 1; } 75% { opacity: 1; } 88%, 100% { transform: translateX(36px); opacity: 0; } }
    @keyframes halo { 0%, 100% { opacity: .24; transform: scale(.92); } 50% { opacity: .55; transform: scale(1.12); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @media (prefers-reduced-motion: reduce) { .cell, .packet, .halo, .float { animation: none; } }
  </style>
  <rect x="1" y="1" width="998" height="250" rx="20" fill="#f4fafa" stroke="#d8e9e8"/>
  <rect x="22" y="18" width="956" height="109" rx="12" fill="url(#dots)"/>
  <path d="M36 126 H964" stroke="#d8e9e8"/>
  <g fill="none" stroke="#078e8a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M49 49 L66 39 L83 49 V69 L66 79 L49 69 Z"/>
