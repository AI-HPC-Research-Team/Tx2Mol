    <circle cx="66" cy="39" r="4" fill="#f4fafa"/>
    <circle cx="83" cy="69" r="4" fill="#db735f" stroke="#db735f"/>
  </g>
  <text x="119" y="70" font-size="43" font-weight="750" letter-spacing="-1.5" fill="#153c49">Tx<tspan fill="#078e8a">2</tspan>Mol</text>
  <text x="121" y="98" font-size="16" fill="#54747e">From gene expression to molecular design</text>
  <g class="float" fill="none" stroke-width="2">
    <path d="M660 70 H690 L701 51 L714 89 L727 61 L739 76 H770" stroke="#078e8a" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M789 70 H831" stroke="#bfdedc" stroke-dasharray="3 6"/>
    <path d="M873 49 L893 60 V83 L873 95 L853 83 V60 Z M893 60 L913 48 M893 83 L913 95" stroke="#078e8a"/>
