on-delay:-1.35s"/><rect class="cell" x="55" y="201" width="6" height="6" rx="1.5" fill="#078e8a" opacity="0.87" style="animation-delay:-1.59s"/><rect class="cell" x="64" y="201" width="6" height="6" rx="1.5" fill="#078e8a" opacity="0.43" style="animation-delay:-1.83s"/><rect class="cell" x="73" y="201" width="6" height="6" rx="1.5" fill="#db735f" opacity="0.65" style="animation-delay:-2.07s"/><rect class="cell" x="82" y="201" width="6" height="6" rx="1.5" fill="#078e8a" opacity="0.87" style="animation-delay:-2.31s"/>
  <text x="104" y="177" font-size="18" font-weight="650" fill="#153c49">GeneVAE</text>
  <text x="104" y="202" font-size="14" fill="#54747e">Gene expression pretraining</text>
