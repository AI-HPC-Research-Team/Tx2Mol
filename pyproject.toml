[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tx2mol-reproduce"
version = "0.1.0"
description = "GeneVAE pretraining, Tx2Mol post-training, and ten-target molecule generation"
requires-python = ">=3.10,<3.12"

[project.scripts]
tx2mol-pretrain = "tx2mol.pretrain:main"
tx2mol-finetune = "tx2mol.finetune:main"
tx2mol-generate = "tx2mol.generate:main"

[tool.setuptools.packages.find]
include = ["tx2mol*"]
